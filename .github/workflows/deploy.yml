name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Validate HTML
        run: |
          echo "Checking for broken internal links..."
          # Check that all href references point to existing files
          errors=0
          for f in $(find . -name "*.html" -not -path "./.git/*" -not -path "./create-slides-skill/*" -not -path "./deep-research-skill/*"); do
            # Extract relative hrefs
            grep -oP 'href="([^"]*)"' "$f" | grep -oP '"[^"]*"' | tr -d '"' | while read -r href; do
              # Skip external links, anchors, mailto, sms
              case "$href" in
                http*|mailto:*|sms:*|tel:*|#*|javascript:*) continue ;;
              esac
              # Resolve relative path
              dir=$(dirname "$f")
              target="$dir/$href"
              if [ ! -f "$target" ] && [ ! -f ".$target" ]; then
                echo "WARNING: $f -> $href (not found)"
                errors=$((errors + 1))
              fi
            done
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors potential broken links (warnings only, not blocking)"
          else
            echo "All internal links OK"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
